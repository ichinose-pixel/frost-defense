<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>フロスト・ディフェンス v13</title>
    <link rel="stylesheet" href="styles/game.css?v=13" />
  </head>
  <body>
    <div id="hud" class="hidden">
      <div class="chip">🌲<span id="wood">0</span></div>
      <div class="chip">🪨<span id="coal">0</span></div>
      <div class="chip">⚙️<span id="iron">0</span></div>
      <div class="chip">
        📅Day <span id="day">1</span> <span id="phase">日中</span>
      </div>
      <div class="chip">🌡️<span id="temp">-10</span>℃</div>
      <div class="chip">🔥<span id="fire">100</span>%</div>
      <div class="chip">
        🏰Lv<span id="baseLv">1</span> <span id="base">100</span>%
      </div>
    </div>
    <div id="crosshair" class="hidden">+</div>
    <div id="phaseBar" class="hidden"><div id="phaseFill"></div></div>
    <div id="baseBadge" class="hidden">🏰 拠点 <span>Lv.1</span></div>
    <div id="missionCard" class="hidden">
      <div class="missionLabel">MISSION</div>
      <div id="objective"></div>
      <div id="miniTip"></div>
    </div>
    <div id="combo">COMBO x<span id="comboN">2</span></div>
    <div id="modeRow" class="hidden"></div>
    <button id="actBtn" class="hidden"></button
    ><button id="fuelBtn" class="hidden"></button>
    <div id="joyBase"></div>
    <div id="joyKnob"></div>
    <div id="autoHint" class="hidden"></div>
    <div id="waveBanner"></div>
    <div id="toast"></div>
    <div id="flash"></div>
    <div id="groundLabels"></div>
    <div id="runtimeStatus" role="status" hidden></div>
    <div id="title" class="overlay">
      <h1>❄️ フロスト・ディフェンス</h1>
      <h2>— 選べる建築・すっきり地面UI v13 —</h2>
      <p>
        <b>操作は移動だけ。</b
        ><br />採集・戦闘は自動。建築は設備のそばで少し立ち止まる。
      </p>
      <p id="startupError" role="alert" hidden></p>
      <button class="btn" id="startBtn">ゲーム開始</button>
    </div>
    <div id="gameover" class="overlay hidden">
      <h1 id="goTitle">🧊 焚き火が消えた…</h1>
      <h2 id="goSub"></h2>
      <p id="goStat"></p>
      <button class="btn" id="retryBtn">もう一度挑戦</button>
    </div>
    <div id="upgrade" class="overlay hidden">
      <h1>✨ 生存ボーナス</h1>
      <h2>次の夜に備えて1つ強化</h2>
      <div id="upgradeCards"></div>
    </div>
    <script src="vendor/three-0.160.0.min.js"></script>
    <script src="dist/game.js?v=13"></script>
  </body>
</html>
