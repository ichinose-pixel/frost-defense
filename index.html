<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><title>フロスト・ディフェンス v10</title><link rel="stylesheet" href="style-v9.css"></head><body>
<div id="hud" class="hidden">
  <div class="chip">🌲<span id="wood">0</span></div>
  <div class="chip">🪨<span id="coal">0</span></div>
  <div class="chip">⚙️<span id="iron">0</span></div>
  <div class="chip">📅Day <span id="day">1</span> <span id="phase">日中</span></div>
  <div class="chip">🌡️<span id="temp">-10</span>℃</div>
  <div class="chip">🔥<span id="fire">100</span>%</div>
  <div class="chip">🏰Lv<span id="baseLv">1</span> <span id="base">100</span>%</div>
</div>
<div id="crosshair" class="hidden">+</div>
<div id="phaseBar" class="hidden"><div id="phaseFill"></div></div>
<div id="baseBadge" class="hidden">🏰 拠点 <span>Lv.1</span></div>
<div id="missionCard" class="hidden"><div class="missionLabel">MISSION</div><div id="objective"></div><div id="miniTip"></div></div>
<div id="combo">COMBO x<span id="comboN">2</span></div><div id="modeRow" class="hidden"></div><button id="actBtn" class="hidden"></button><button id="fuelBtn" class="hidden"></button><div id="joyZone"></div><div id="joyBase"></div><div id="joyKnob"></div><div id="autoHint" class="hidden"></div><div id="waveBanner"></div><div id="toast"></div><div id="flash"></div>
<div id="title" class="overlay"><h1>❄️ フロスト・ディフェンス</h1><h2>— 爽快感強化 v10 —</h2><p><b>操作は移動だけ。</b><br>採集・建築・外部拠点の確保・戦闘は自動。</p><button class="btn" id="startBtn">ゲーム開始</button></div>
<div id="gameover" class="overlay hidden"><h1 id="goTitle">🧊 焚き火が消えた…</h1><h2 id="goSub"></h2><p id="goStat"></p><button class="btn" id="retryBtn">もう一度挑戦</button></div>
<div id="upgrade" class="overlay hidden"><h1>✨ 生存ボーナス</h1><h2>次の夜に備えて1つ強化</h2><div id="upgradeCards"></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="v9-1.js"></script><script src="v9-2.js"></script><script src="v9-3.js"></script><script src="v9-4.js"></script><script src="v9-5.js"></script><script src="v9-6.js"></script><script src="v9-7.js"></script><script src="v10-patch.js"></script></body></html>
